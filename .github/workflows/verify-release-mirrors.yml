name: Verify release mirrors

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release to verify without rebuilding or publishing'
        required: true
        default: v0.1.6
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify public GitHub and CNB installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/sync-cnb-release.py --verify "$TAG" --wait 1200
